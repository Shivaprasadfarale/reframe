name: Contributor Welcome Greeter

on:
  issues:
    types: [ opened ]
  pull_request_target:
    types: [ opened ]

permissions:
  issues: write
  pull-requests: write

jobs:
  greeting:
    name: 👋 Welcome New Contributors
    runs-on: ubuntu-latest
    steps:
      - name: Welcome First-Time Contributor
        uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: |
            🎉 **Thanks for opening your first issue on Reframe!**
            We really appreciate your feedback and suggestions. A maintainer will look into this shortly.
            
            In the meantime, feel free to check out our [User Workflow Guide](https://github.com/Shivaprasadfarale/reframe/blob/main/WORKFLOW_GUIDE.md).
          pr-message: |
            🚀 **Welcome and thank you for your first Pull Request on Reframe!**
            We're thrilled to have your contribution. The automated CI suite is now verifying your changes.
            
            Please make sure you've reviewed our [Contributing Guidelines](https://github.com/Shivaprasadfarale/reframe/blob/main/CONTRIBUTING.md).
