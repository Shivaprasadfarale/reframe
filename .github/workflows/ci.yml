name: CI Build & Template Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-schema:
    name: Validate JSON Schemas
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate JSON Files
        run: |
          python -c "
          import json, glob
          for path in glob.glob('**/*.json', recursive=True):
              with open(path, 'r', encoding='utf-8') as f:
                  json.load(f)
              print(f'[+] VALID: {path}')
          "

  verify-latex:
    name: Verify LaTeX Compilation
    runs-on: ubuntu-latest
    needs: validate-schema
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install TeX Live
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-base texlive-fonts-recommended texlive-latex-extra

      - name: Generate & Test Sample Resume
        run: |
          python -c "
          with open('base_template.tex', 'r', encoding='utf-8') as f:
              content = f.read()

          # Inject sample test data
          replacements = {
              '{{NAME}}': 'Jane Doe',
              '{{LOCATION}}': 'San Francisco, CA',
              '{{PHONE}}': '+1-555-019-2834',
              '{{EMAIL}}': 'janedoe@example.com',
              '{{LINKEDIN_URL}}': 'https://linkedin.com/in/janedoe',
              '{{LINKEDIN_DISPLAY}}': 'linkedin.com/in/janedoe',
              '{{#HAS_GITHUB}}': '',
              '{{/HAS_GITHUB}}': '',
              '{{GITHUB_URL}}': 'https://github.com/janedoe',
              '{{GITHUB_DISPLAY}}': 'github.com/janedoe',
              '{{#HAS_PORTFOLIO}}': '%',
              '{{/HAS_PORTFOLIO}}': '%',
              '{{PORTFOLIO_URL}}': '',
              '{{PORTFOLIO_DISPLAY}}': '',
              '{{SUMMARY_TEXT}}': 'Computer Science graduate with strong skills in web development and data structures.',
              '{{EDUCATION_ENTRIES}}': r'\resumeSubheading{UC Berkeley}{Berkeley, CA}{B.S. in Computer Science}{2022 -- 2026}',
              '{{PROJECTS_SECTION_TITLE}}': 'Technical Projects',
              '{{PROJECT_ENTRIES}}': r'\resumeProjectHeading{\textbf{Risk Analytics Platform} $|$ \emph{Python, SQL}}{2025}\resumeItemListStart\resumeItem{Engineered risk monitoring pipeline across 8,000+ records.}\resumeItemListEnd',
              '{{EXPERIENCE_ENTRIES}}': r'\resumeProjectHeading{\textbf{Software Intern} $|$ \emph{TechCorp}}{2025}\resumeItemListStart\resumeItem{Built REST APIs and resolved 25+ defects.}\resumeItemListEnd',
              '{{LANGUAGES_SKILLS}}': 'Python, SQL, JavaScript',
              '{{FRAMEWORKS_SKILLS}}': 'React, Node.js',
              '{{TOOLS_SKILLS}}': 'Git, PostgreSQL, VS Code',
              '{{COMPETENCIES_SKILLS}}': 'REST APIs, Agile Collaboration',
              '{{ACHIEVEMENTS_ENTRIES}}': r'\resumeItem{Winner -- University Hackathon (2025)}'
          }
          for k, v in replacements.items():
              content = content.replace(k, v)

          with open('ci_test_resume.tex', 'w', encoding='utf-8') as f:
              f.write(content)
          "

      - name: Compile LaTeX to PDF
        run: |
          mkdir -p pdf_output
          pdflatex -interaction=nonstopmode -output-directory=pdf_output ci_test_resume.tex
          test -f pdf_output/ci_test_resume.pdf
          echo "[+] LaTeX template compilation SUCCEEDED with 0 errors!"
